name: Build Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies & Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot build-essential curl unzip git clang lld
          git clone --recursive https://github.com $HOME/theos
          curl -LO https://github.com
          unzip -q master.zip
          mv sdks-master/*.sdk $HOME/theos/sdks/

      - name: Build .deb
        env:
          THEOS: /home/runner/theos
        run: |
          make package FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTLocalQueue
          path: packages/*.deb
