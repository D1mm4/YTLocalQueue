name: Build Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1.5

      - name: Download YouTube Headers
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com temp_headers
          cd temp_headers
          git sparse-checkout set YouTubeHeader
          cd ..
          mkdir -p Headers
          mv temp_headers/YouTubeHeader Headers/YouTubeHeader
          rm -rf temp_headers

      - name: Build .deb
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTLocalQueue
          path: packages/*.deb
